# Cruise fare and inventory panel -- configuration.
#
# Everything a human might want to change lives here: rate limits, date windows,
# the cabin mapping, and the daily-marker sailing list.

storage:
  db_path: data/panel.sqlite
  raw_archive_path: data/raw

http:
  # Honest, contactable identification. Do not replace with a browser UA string.
  user_agent: "cruise-fare-panel/0.1 (equity research; contact runoffgeorge@gmail.com)"
  min_interval_s: 2.0      # hard floor between requests to one host
  max_retries: 4           # applies to 429/503 and transport errors only
  backoff_base_s: 2.0
  backoff_cap_s: 60.0
  timeout_s: 60.0
  obey_robots: true        # a disallowed path raises before any request is sent

tiers:
  weekly-full:
    # The comprehensive snapshot: all lines, all configured regions, swept
    # weekly. The window starts in the near term and runs through the disputed
    # 2027 book, so one tier answers both "what is the forward book priced at"
    # and "what is happening to sailings that are about to go". daily-marker
    # then re-reads a curated subset of the near-term end of this range every
    # day; the two tiers overlap in dates by design and are never pooled.
    #
    # End extended 2026-09-17 from 2027-08-31 to 2028-10-31. The old end cut
    # off all of Sep-Dec 2027 and every 2028 sailing: 32% of the pricing rows
    # NCL returned for itineraries we already fetched, plus ~365 itineraries
    # that only sail after Aug 2027 and were never enumerated. 2028-10-31 is
    # NCL's published horizon -- past it, NCL's search ignores the month
    # filter and returns the whole catalogue (see NCLSource.discover_itineraries).
    # Carnival publishes into Apr 2029; those later sailings are counted as
    # dropped rather than collected, because they would have no NCL peer.
    sail_window:
      start: "2026-10-01"
      end: "2028-10-31"

  daily-marker:
    # Near-term control cohort: reprices faster than far-out sailings.
    # ROLLING horizon, not fixed dates. Set 2026-09-17. A fixed end date walks
    # toward the run date: the original 2026-12-31 already capped this tier at
    # 105 days out, entirely INSIDE the 120-day final-payment boundary, so the
    # daily tier could only ever see one side of it. 240 days keeps the
    # requested 210-day view permanently, whatever the run date, and keeps the
    # boundary comfortably inside scope. Same marker itineraries and the same
    # request count -- only more of each itinerary's sailings are kept.
    sail_window:
      horizon_days: 240
    # Restrict to the marker list below plus anything inside the earnings window.
    marker_only: true
    event_date: "2026-11-04"     # NCLH Q3 print
    event_window_days: 14        # +/- two weeks around it
    # Per-line marker itinerary codes. Keyed by line so each source only asks
    # its own API for its own codes. Populate from a completed weekly-full run
    # with: python scripts/pick_markers.py --write
    #
    # While these are empty the tier falls back to enumerating the whole
    # near-term window, which is NOT the intended behaviour -- it collects
    # arbitrary sailings rather than chosen strata.
    marker_itineraries:
      ncl:
        - AQUA7MIAPOPSTTTOVNPIMIA
        - ESCAPE7PCVPOPSTTTOVNPIPCV
        - GETAWAY5PCVPOPNPIPCV
        - LUNA7MIARTBBPICMACZMMIA
        - EPIC7CIVSALCTALIVVLFMRSBCN
        - GEM7RAVSPUDBVKOTCFUMSNSALCIV
        - DAWN7BCNPMIALCMOTGIBCADPRMLIS
        - PEARL7PIRJTRKAKCFUKOTDBVKOPRAV
        - STAR11BCNMOTCADCASAGAACESCTFNCLXOLIS
        - PRIMA13CIVPMIBCNVLFLIVCIVSALMSNCFUBARDBVSPURAV
        - SUN7CIVSALCTACFUKOTSPUKOPRAV
        - VIVA9RAVDBVBARSALCIVSPEVLFPMIBCN
        - STAR10SOUGOTCPHHAMIJMZEELEHSOU
        - SUN10HELTLLNYNRIXKLJGDYWARCPHSOU
        - BREAKAWAY7BOSHALWRFBOS
        - ENCORE7SEAJNUSGYKTNVICSEA
      carnival:
        - BME
        - CW6
        - GLB
        - WC2
        - BA9
        - MEP
        - BHR
        - GA2
lines:
  ncl:
    line: "Norwegian Cruise Line"
    brand: "NCL"
    enabled: true
    base_url: "https://www.ncl.com"
    search_page_size: 50
    max_itineraries: null      # null = no cap

    # Explicit label -> standard category. No fuzzy matching anywhere.
    # An unlisted label is logged to `unmapped_labels` and stored with a NULL
    # cabin_category rather than guessed at.
    #
    # JUDGEMENT CALL -- MINISUITE: NCL sells this as "Club Balcony Suite". It is
    # physically a balcony stateroom marketed with suite branding, so it is mapped
    # to `balcony`. Mapping it to `suite` would inflate the suite tier by roughly
    # the size of the balcony tier and corrupt peer_gap comparisons against lines
    # with no mini-suite product. Flip it here if you disagree -- it is one line,
    # and re-running normalization over the raw archive will rebuild the panel.
    cabin_map:
      STUDIO:    inside      # solo interior cabin, no window
      INSIDE:    inside
      OCEANVIEW: oceanview
      BALCONY:   balcony
      MINISUITE: balcony     # see note above
      SUITE:     suite
      HAVEN:     suite       # NCL's ship-within-a-ship suite complex

    # Vendor destination code -> panel region. Unlisted codes yield a NULL region
    # and are excluded by the `regions` filter below.
    # BAHAMAS is folded into Caribbean: the sailings are Caribbean-basin and would
    # otherwise drop out of the panel entirely.
    region_map:
      CARIBBEAN:       Caribbean
      BAHAMAS:         Caribbean
      MEDITERRANEAN:   Southern Europe
      GREEK_ISLES:     Southern Europe
      NORTHERN_EUROPE: Northern Europe
      BERMUDA:         Bermuda
      ALASKA:          Alaska

    # Regions collected. Southern Europe is where the thesis concentrates and is
    # collected in full.
    regions:
      - Caribbean
      - Southern Europe
      - Northern Europe
      - Bermuda
      - Alaska


  # ---------------------------------------------------------------- control
  # Royal is a CONTROL line, not a peer: one floor price per sailing -- the
  # number the published sell-side series carry -- so the panel can show the
  # floor moving differently from the distribution behind it.
  #
  # DISABLED, and the reason is a coverage finding, not an oversight.
  # Probed 2026-09-16. robots.txt disallows /booking/ and /room-selection/,
  # the only paths carrying a cabin distribution, so floor-only was always the
  # ceiling here and that part is fine. The problem is the allowed surface:
  #
  #   * /cruises renders NO sailings server-side, with or without a
  #     ?search=destination:... query. Results are fetched client-side.
  #   * The destination landing pages do render sailings, but all five return
  #     the SAME 10 generic "Recommended" departures -- pairwise overlap 10/10.
  #     The Bermuda page carries zero Bermuda sailings; the Alaska page zero
  #     Alaska. They are marketing carousels, not a sailing index.
  #
  # So the allowed surface yields ~20 mostly-Bahamas sailings that cannot
  # support a regional floor series aligned with the other two lines. Enabling
  # this would put generic Caribbean promos into the panel as a control and
  # invite a comparison the data cannot carry.
  #
  # The collector, capability and region mapping are built and tested, so this
  # becomes a one-line change if a usable allowed endpoint is found. What it
  # needs is Royal's client-side search API, which has not been located on an
  # allowed path and would require its own robots check on whatever host it
  # lives on.
    # Hull class, mapped explicitly. The booking curve controls region,
    # itinerary length, cabin grade and season; hull class is the remaining
    # composition axis, and the two fleets are not aged alike.
    ship_classes:
      Prima: [Norwegian Prima, Norwegian Viva, Norwegian Aqua, Norwegian Luna,
              Norwegian Aura]
      Breakaway-Plus: [Norwegian Escape, Norwegian Joy, Norwegian Bliss,
                       Norwegian Encore]
      Breakaway: [Norwegian Breakaway, Norwegian Getaway]
      Jewel: [Norwegian Jewel, Norwegian Jade, Norwegian Pearl, Norwegian Gem]
      Dawn: [Norwegian Dawn, Norwegian Star]
      Sun: [Norwegian Sun]
      Epic: [Norwegian Epic]
    # Hull GENERATION is the cross-line-comparable axis: class names never
    # match between lines (Prima is not Excel), so a class split makes the
    # peer premium uncomputable. Generation is a judgement, stated here rather
    # than buried in code, and it is what the ship-mix objection needs.
    ship_generation:
      Prima: newest
      Breakaway-Plus: recent
      Breakaway: recent
      Epic: mid
      Jewel: older
      Dawn: older
      Sun: older

  royal:
    line: "Royal Caribbean International"
    brand: "Royal Caribbean"
    enabled: false
    base_url: "https://www.royalcaribbean.com"
    cabin_map: {}
    # Region comes from each record's own destinationCode, never from the page
    # it was found on -- the pages mix destinations freely. Unmapped codes are
    # dropped and logged, never bucketed by fallback.
    region_map:
      CARIB: Caribbean
      BAHAM: Caribbean
      BERMU: Bermuda
      ALASK: Alaska
      MEDIT: Southern Europe
      GREEK: Southern Europe
      EUROP: Northern Europe
      BALTC: Northern Europe
      NORWY: Northern Europe
    regions:
      - Caribbean
      - Bermuda
      - Alaska
      - Southern Europe
      - Northern Europe
    landing_pages:
      Caribbean: /caribbean-cruises
      Bermuda: /bermuda-cruises
      Alaska: /alaska-cruises
      Southern Europe: /mediterranean-cruises
      Northern Europe: /european-cruises


  carnival:
    line: "Carnival Cruise Line"
    brand: "Carnival"
    enabled: true
    base_url: "https://www.carnival.com"
    search_page_size: 20
    max_pages: null            # null = page to lastPage

    # Carnival's meta codes are the stable per-sailing cabin label and carry the
    # natural key. The finer categoryCode (8A/GS/6K) goes to vendor_category_code,
    # which is NULL on sold-out cells and NULL for every source that lacks it.
    cabin_map:
      IS: inside
      OS: oceanview
      OB: balcony
      SU: suite

    # regionCode is authoritative. Carnival's `dest` filter collapses all of
    # Europe into a single "E", which is useless for a thesis concentrated on
    # Southern Europe; regionCode separates them properly.
    # Codes below are the ones actually observed in the fleet -- unobserved codes
    # are deliberately absent and will be logged to unmapped_labels, not guessed.
    region_map:
      # Southern Europe
      ME: Southern Europe       # Mediterranean
      GI: Southern Europe       # Greek Isles, Turkey & Italy
      CG: Southern Europe       # Croatia, Greece & Italy
      IB: Southern Europe       # Spain, Portugal & France
      EC: Southern Europe       # Eclipse, Spain, Portugal & ... (Iberian routing)
      # Northern Europe
      EN: Northern Europe       # Northern Europe
      ES: Northern Europe       # Scandinavia & Baltic
      BI: Northern Europe       # British Isles
      # Caribbean basin -- BH folded in, matching the NCL treatment
      CE: Caribbean             # Eastern Caribbean
      CW: Caribbean             # Western Caribbean
      CS: Caribbean             # Southern Caribbean
      BH: Caribbean             # The Bahamas
      CP: Caribbean             # Caribbean & Panama. JUDGEMENT CALL: a partial
                                # canal transit calling Caribbean ports. Carnival
                                # files full Panama Canal runs separately under T,
                                # which stays out of scope, so CP sits with the
                                # Caribbean rather than alone.
      # Others
      BM: Bermuda
      GL: Alaska                # Alaska Inside Passage & Glacier Bay
      # Repositioning crossings. Deliberately NOT Southern Europe even though
      # they embark at Civitavecchia and Barcelona: these are 13+ day Atlantic
      # crossings, a different product at a different price, and folding them
      # into the Med would corrupt the series the thesis rests on. Kept as their
      # own region so they are visible instead of silently dropped.
      ET: Transatlantic         # Transatlantic

    # Fallback ONLY when Carnival publishes no regionCode at all, and only for
    # ports that serve exactly one region. A regionCode that is present but
    # unmapped is logged, never overruled by the port -- see resolve_region().
    # London (LON) is deliberately absent: it is the embark port for Northern
    # itineraries (EN, ES, BI) *and* Iberian ones (IB, EC), so mapping it either
    # way would silently misclassify the region the thesis depends on.
    port_region_map:
      BCN: Southern Europe      # Barcelona
      CIV: Southern Europe      # Civitavecchia (Rome)
      LIS: Southern Europe      # Lisbon

    # Empty = one unfiltered sweep of the whole search index, which is what we
    # want. The old dest filter list ["E","C","BH","BM","A"] reached only 402 of
    # the 482 itinerary records Carnival publishes: the missing 17% included
    # Carnival Legend's 2026-11-01 Civitavecchia departure and Carnival
    # Freedom's 2026-10-17 Barcelona departure, which is why Southern Europe
    # looked empty in the near-term window. Scope is decided by `regions` below,
    # not by guessing which dest buckets matter.
    dest_codes: []

    regions:
      - Caribbean
      - Southern Europe
      - Northern Europe
      - Bermuda
      - Alaska
      # Collected and reported separately, never counted as Southern Europe.
      # These are the Civitavecchia/Barcelona October-November 2026 departures:
      # repositioning crossings, not Mediterranean cruises.
      - Transatlantic

    ship_classes:
      Excel: [Mardi Gras, Carnival Celebration, Carnival Jubilee,
              Carnival Festivale, Carnival Tropicale]
      Vista: [Carnival Vista, Carnival Horizon, Carnival Panorama,
              Carnival Firenze, Carnival Venezia, Carnival Luminosa]
      Dream: [Carnival Dream, Carnival Magic, Carnival Breeze]
      Conquest: [Carnival Conquest, Carnival Glory, Carnival Valor,
                 Carnival Liberty, Carnival Freedom, Carnival Sunshine,
                 Carnival Sunrise]
      Spirit: [Carnival Spirit, Carnival Pride, Carnival Legend,
               Carnival Miracle]
      Fantasy: [Carnival Elation, Carnival Paradise]
    ship_generation:
      Excel: newest
      Vista: recent
      Dream: mid
      Conquest: older
      Spirit: older
      Fantasy: older
